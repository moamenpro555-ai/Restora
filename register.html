<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/variables.css?v=20261127e"><link rel="stylesheet" href="css/global.css?v=20261127e"><link rel="stylesheet" href="css/layout.css?v=20261127e"><title>تسجيل مطعم</title></head><body><div class="container" style="max-width:460px">
<form class="card" onsubmit="doRegister(event)"><h2>سجّل مطعمك</h2>
<label>اسم المطعم</label><input name="restaurantName" required minlength="2">
<label>نوع النشاط</label><select name="businessType">
<option value="fast-food">وجبات سريعة</option><option value="cafe">كافيه</option><option value="traditional">مطعم تقليدي</option>
<option value="fine-dining">فاين داينينج</option><option value="bakery">مخبوزات</option><option value="pizza">بيتزا</option>
<option value="burger">برجر</option><option value="juice-shop">عصائر</option><option value="dessert-shop">حلويات</option>
<option value="food-truck">فود تراك</option><option value="other">أخرى</option></select>
<label>معرّف الرابط (اختياري، حروف إنجليزية/أرقام/شرطة) — يُستخدم في رابط المنيو</label><input name="slug" pattern="[a-z0-9\-]{3,40}" placeholder="my-restaurant" dir="ltr">
<label>اسم المالك</label><input name="ownerName" required><label>البريد</label><input name="email" type="email" required>
<label>كلمة المرور (8 أحرف على الأقل)</label><input name="password" type="password" minlength="8" required>
<button class="btn" style="width:100%">إنشاء الحساب (تجربة 14 يوم)</button></form></div><script src="js/config.js?v=20261127e"></script><script src="js/ui.js?v=20261127e"></script><script src="js/api.js?v=20261127f"></script><script src="js/branding.js?v=20261127e"></script><script src="js/auth.js?v=20261127e"></script></body></html>
